spring.application.name=credipolicy

# Aplicacao acessivel somente neste computador.
server.address=127.0.0.1
server.port=8080

# Banco H2 persistido em arquivo.
# O caminho e relativo a pasta onde a aplicacao e iniciada.
spring.datasource.url=jdbc:h2:file:./dados-locais/credipolicy
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracao para o prototipo local.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false